
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b19">
<title>Mi Galaxia 🌌</title>
<style>
:root{--bg:#100b19;--panel:#1d1429;--card:#291d39;--text:#f8f0ff;--muted:#c0b1d0;--accent:#c99aff;--line:#49345c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#40245b,var(--bg) 70%);color:var(--text);font-family:system-ui,Arial,sans-serif}
header{text-align:center;padding:26px 15px}
h1{color:#e4c8ff;margin:4px;font-size:30px}
header p{color:var(--muted)}
main{max-width:950px;margin:auto;padding:12px 16px 50px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}
h2{font-size:19px;margin:0 0 13px}
button,.upload{background:#7546a0;color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:650;cursor:pointer;display:inline-block}
.secondary{background:#382849;border:1px solid var(--line)}
.danger{background:#783b59}
input,select{background:#120d1b;color:white;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;max-width:100%}
input[type=file]{display:none}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.controls input{flex:1;min-width:130px}
.stats{display:flex;gap:9px;flex-wrap:wrap}
.stat{background:#291d39;padding:12px;border-radius:12px;flex:1;min-width:75px;text-align:center}
.stat strong{display:block;font-size:23px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px;margin-top:15px}
.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.cover{height:185px;background:linear-gradient(145deg,#70449a,#21132e);border-radius:9px;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}
.cover img{width:100%;height:100%;object-fit:contain}
.cover span{font-size:48px}
.book h3{font-size:14px;overflow-wrap:anywhere;margin:5px 0}
.book small{color:var(--muted)}
.book select,.book button{width:100%;margin-top:8px}
.book select{padding:8px}
.book button{padding:9px}
.empty{text-align:center;color:var(--muted);padding:25px}
footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}
#reader{display:none;position:fixed;inset:0;background:#100b19;z-index:10;padding:10px;overflow:auto}
#readerBar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
#readerTitle{color:#e5caff;flex:1;font-size:14px;min-width:100px}
#pageInfo{color:var(--muted);font-size:13px}
#readingArea{background:#eee5d8;color:#21192a;border-radius:10px;min-height:78vh;padding:8px;text-align:center}
#pdfCanvas{max-width:100%;height:auto}
#epubView{height:78vh;background:#f5eddf}
.readerError{padding:25px;color:#35233f}
</style>
</head>
<body>
<header>
<h1>🌌 Mi Galaxia</h1>
<p>Tu universo personal de lectura</p>
</header>
<main>
<section class="panel">
<h2>✨ Mi biblioteca</h2>
<p style="color:var(--muted)">Tus historias favoritas tienen su propio lugar.</p>
<div class="controls">
<label class="upload" for="files">＋ Añadir mis libros</label>
<input id="files" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple>
<input id="search" placeholder="Buscar un libro...">
</div>
<p id="message" style="color:#d8b5ff;font-size:13px"></p>
</section>
<section class="panel">
<h2>📚 Mi progreso</h2>
<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Libros</span></div>
<div class="stat"><strong id="reading">0</strong><span>Leyendo</span></div>
<div class="stat"><strong id="pending">0</strong><span>Pendientes</span></div>
<div class="stat"><strong id="finished">0</strong><span>Terminados</span></div>
</div>
</section>
<section class="panel">
<div class="controls" style="justify-content:space-between">
<h2 style="margin:0">🌙 Mis estanterías</h2>
<select id="filter">
<option>Todos</option>
<option>Leyendo</option>
<option>Pendientes</option>
<option>Terminados</option>
</select>
</div>
<div id="books" class="grid"></div>
</section>
<footer>Hecho con cariño para tu universo de libros 💜</footer>
</main>
<div id="reader">
<div id="readerBar">
<button class="secondary" id="closeReader">← Biblioteca</button>
<strong id="readerTitle"></strong>
<button class="secondary" id="previous">Anterior</button>
<span id="pageInfo"></span>
<button class="secondary" id="next">Siguiente</button>
</div>
<div id="readingArea"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<script>
// Desactiva el service worker antiguo para cargar esta versión.
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.getRegistrations().then(list => list.forEach(reg => reg.unregister()));
}
if ('caches' in window) {
 caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
}
const $ = id => document.getElementById(id);
let db = null, allBooks = [], pdfDoc = null, epubBook = null, rendition = null, currentPage = 1;
if (window.pdfjsLib) {
 pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
const request = indexedDB.open('MiGalaxiaDB', 1);
request.onupgradeneeded = event => {
 const d = event.target.result;
 if (!d.objectStoreNames.contains('books')) {
  d.createObjectStore('books', {keyPath:'id', autoIncrement:true});
 }
};
request.onsuccess = event => {
 db = event.target.result;
 loadBooks();
};
request.onerror = () => {
 $('message').textContent = 'No se pudo abrir la biblioteca del navegador.';
};
function store(mode='readonly') {
 return db.transaction('books', mode).objectStore('books');
}
function loadBooks() {
 const r = store().getAll();
 r.onsuccess = () => {
  allBooks = r.result;
  render();
 };
}
function saveBook(book) {
 const r = store('readwrite').add(book);
 r.onsuccess = () => {
  loadBooks();
  $('message').textContent = '¡Libro guardado en tu galaxia! ✨';
 };
 r.onerror = () => {
  $('message').textContent = 'No se pudo guardar el libro.';
 };
}
$('files').addEventListener('change', event => {
 [...event.target.files].forEach(file => {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['pdf','epub'].includes(ext)) return;
  saveBook({
   name:file.name.replace(/\.(pdf|epub)$/i,''),
   type:ext,
   file:file,
   status:'Pendientes',
   added:Date.now()
  });
 });
 event.target.value = '';
});
function render() {
 $('total').textContent = allBooks.length;
 $('reading').textContent = allBooks.filter(b => b.status === 'Leyendo').length;
 $('pending').textContent = allBooks.filter(b => b.status === 'Pendientes').length;
 $('finished').textContent = allBooks.filter(b => b.status === 'Terminados').length;
 const area = $('books');
 area.replaceChildren();
 const term = $('search').value.toLowerCase();
 const filter = $('filter').value;
 const visible = allBooks.filter(b =>
  (filter === 'Todos' || b.status === filter) &&
  b.name.toLowerCase().includes(term)
 );
 if (!visible.length) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = allBooks.length
   ? 'No hay libros con ese filtro.'
   : 'Tu galaxia espera sus primeros libros. 💜';
  area.append(p);
  return;
 }
 visible.forEach(book => {
  const card = document.createElement('article');
  card.className = 'book';
  const cover = document.createElement('div');
  cover.className = 'cover';
  const symbol = document.createElement('span');
  symbol.textContent = book.type === 'pdf' ? '📕' : '📘';
  cover.append(symbol);
  const title = document.createElement('h3');
  title.textContent = book.name;
  const info = document.createElement('small');
  info.textContent = book.type.toUpperCase();
  const select = document.createElement('select');
  ['Pendientes','Leyendo','Terminados'].forEach(s => {
   const o = document.createElement('option');
   o.value = s;
   o.textContent = s;
   select.append(o);
  });
  select.value = book.status || 'Pendientes';
  select.onchange = () => {
   const r = store('readwrite').get(book.id);
   r.onsuccess = () => {
    const b = r.result;
    b.status = select.value;
    store('readwrite').put(b);
    loadBooks();
   };
  };
  const open = document.createElement('button');
  open.textContent = 'Leer ahora';
  open.onclick = () => openBook(book);
  const del = document.createElement('button');
  del.className = 'danger';
  del.textContent = 'Eliminar';
  del.onclick = () => {
   if (confirm('¿Eliminar este libro de tu biblioteca?')) {
    store('readwrite').delete(book.id).onsuccess = loadBooks;
   }
  };
  card.append(cover,title,info,select,open,del);
  area.append(card);
  createCover(book,cover);
 });
}
async function createCover(book, element) {
 try {
  if (book.type === 'pdf' && window.pdfjsLib) {
   const doc = await pdfjsLib.getDocument({
    data: await book.file.arrayBuffer()
   }).promise;
   const page = await doc.getPage(1);
   const viewport = page.getViewport({scale:0.55});
   const canvas = document.createElement('canvas');
   canvas.width = viewport.width;
   canvas.height = viewport.height;
   await page.render({
    canvasContext:canvas.getContext('2d'),
    viewport:viewport
   }).promise;
   const img = document.createElement('img');
   img.alt = 'Portada de ' + book.name;
   img.src = canvas.toDataURL('image/jpeg',0.8);
   element.replaceChildren(img);
   await doc.destroy();
  } else if (book.type === 'epub' && window.ePub) {
   const epub = window.ePub(book.file);
   const coverUrl = await epub.coverUrl();
   if (coverUrl) {
    const img = document.createElement('img');
    img.alt = 'Portada de ' + book.name;
    img.src = coverUrl;
    element.replaceChildren(img);
   }
   epub.destroy();
  }
 } catch (error) {
  // Se conserva la cubierta provisional si no se puede extraer.
 }
}
$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
async function openBook(book) {
 $('reader').style.display = 'block';
 $('readerTitle').textContent = book.name;
 $('readingArea').replaceChildren();
 $('pageInfo').textContent = '';
 if (pdfDoc) {
  try { await pdfDoc.destroy(); } catch(e) {}
  pdfDoc = null;
 }
 if (epubBook) {
  try { epubBook.destroy(); } catch(e) {}
  epubBook = null;
 }
 rendition = null;
 currentPage = 1;
 try {
  if (book.type === 'pdf') {
   if (!window.pdfjsLib) {
    throw new Error('No se pudo cargar el lector PDF. Comprueba tu conexión a internet.');
   }
   pdfDoc = await pdfjsLib.getDocument({
    data: await book.file.arrayBuffer()
   }).promise;
   await showPdfPage(1);
  } else {
   if (!window.ePub) {
    throw new Error('No se pudo cargar el lector EPUB. Comprueba tu conexión a internet.');
   }
   const view = document.createElement('div');
   view.id = 'epubView';
   $('readingArea').append(view);
   epubBook = window.ePub(book.file);
   rendition = epubBook.renderTo('epubView',{
    width:'100%',
    height:'78vh'
   });
   await rendition.display();
   $('pageInfo').textContent = 'EPUB';
  }
 } catch(error) {
  const p = document.createElement('p');
  p.className = 'readerError';
  p.textContent = 'No se pudo abrir el libro: ' + error.message;
  $('readingArea').replaceChildren(p);
 }
}
async function showPdfPage(number) {
 if (!pdfDoc) return;
 currentPage = Math.max(1,Math.min(number,pdfDoc.numPages));
 const page = await pdfDoc.getPage(currentPage);
 const viewport = page.getViewport({scale:1.35});
 const canvas = document.createElement('canvas');
 canvas.id = 'pdfCanvas';
 canvas.width = viewport.width;
 canvas.height = viewport.height;
 $('readingArea').replaceChildren(canvas);
 await page.render({
  canvasContext:canvas.getContext('2d'),
  viewport:viewport
 }).promise;
 $('pageInfo').textContent = currentPage + ' / ' + pdfDoc.numPages;
}
$('previous').onclick = () => {
 if (pdfDoc) showPdfPage(currentPage-1);
 else if (rendition) rendition.prev();
};
$('next').onclick = () => {
 if (pdfDoc) showPdfPage(currentPage+1);
 else if (rendition) rendition.next();
};
$('closeReader').onclick = async () => {
 $('reader').style.display = 'none';
 if (pdfDoc) {
  try { await pdfDoc.destroy(); } catch(e) {}
  pdfDoc = null;
 }
 if (epubBook) {
  try { epubBook.destroy(); } catch(e) {}
  epubBook = null;
 }
 rendition = null;
};
</script>
</body>
</html>
